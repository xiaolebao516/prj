}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

            &lt;i data-lucide=&quot;droplets&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
            &lt;span&gt;足量、均匀涂抹&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;article class=&quot;bd-copy&quot; id=&quot;bd-page-copy&quot; aria-live=&quot;polite&quot;&gt;
          &lt;h3&gt;1　测量前准备&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;在前臂桡骨测试部位涂抹足量耦合剂，使皮肤与探头之间均匀覆盖。&lt;/li&gt;
            &lt;li&gt;将探头充分贴合测试部位，先调整右侧 D，再调整左侧 G。&lt;/li&gt;
            &lt;li&gt;最终目标是让两条进度条均稳定在中线，然后保持探头不动。&lt;/li&gt;
            &lt;li&gt;每轮累计 30 个有效值；姿势和信号稳定时通常约 5 秒，共完成 5 轮。&lt;/li&gt;
          &lt;/ol&gt;
          &lt;div class=&quot;bd-emphasis&quot;&gt;每轮结束后，按空格或点击“开始检测”继续下一轮。&lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;footer class=&quot;bd-dialog-foot&quot;&gt;
        &lt;div class=&quot;bd-dots&quot; id=&quot;bd-dots&quot; aria-label=&quot;教学页码&quot;&gt;
          &lt;span class=&quot;bd-dot active&quot;&gt;&lt;/span&gt;&lt;span class=&quot;bd-dot&quot;&gt;&lt;/span&gt;&lt;span class=&quot;bd-dot&quot;&gt;&lt;/span&gt;
          &lt;span class=&quot;bd-page-count&quot; id=&quot;bd-page-count&quot;&gt;1 / 3&lt;/span&gt;
        &lt;/div&gt;
        &lt;button class=&quot;btn btn-ghost&quot; id=&quot;bd-skip&quot; type=&quot;button&quot;&gt;跳过教程&lt;/button&gt;
        &lt;div class=&quot;viz-row&quot;&gt;
          &lt;button class=&quot;btn&quot; id=&quot;bd-prev&quot; type=&quot;button&quot; disabled&gt;上一步&lt;/button&gt;
          &lt;button class=&quot;btn btn-primary&quot; id=&quot;bd-next&quot; type=&quot;button&quot;&gt;下一步&lt;/button&gt;
        &lt;/div&gt;
      &lt;/footer&gt;
    &lt;/section&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;bd-guide-preview&quot;);
      const dialog = root.querySelector(&quot;#bd-dialog&quot;);
      const dim = root.querySelector(&quot;#bd-dim&quot;);
      const body = root.querySelector(&quot;#bd-guide-body&quot;);
      const storyboard = root.querySelector(&quot;#bd-storyboard&quot;);
      const storyLabel = root.querySelector(&quot;#bd-story-label&quot;);
      const probe = root.querySelector(&quot;#bd-probe&quot;);
      const gel = root.querySelector(&quot;#bd-gel&quot;);
      const miniMeter = root.querySelector(&quot;#bd-mini-meter&quot;);
      const motion = root.querySelector(&quot;#bd-motion&quot;);
      const copy = root.querySelector(&quot;#bd-page-copy&quot;);
      const dots = [...root.querySelectorAll(&quot;.bd-dot&quot;)];
      const count = root.querySelector(&quot;#bd-page-count&quot;);
      const prev = root.querySelector(&quot;#bd-prev&quot;);
      const next = root.querySelector(&quot;#bd-next&quot;);
      let page = 0;
      let manualMode = false;

      const pages = [
        {
          label: &quot;示意图 1：耦合剂与探头贴合&quot;,
          icon: &quot;droplets&quot;,
          motion: &quot;足量、均匀涂抹&quot;,
          meter: &quot;&quot;,
          probe: &quot;translate(0, 0) rotate(0deg)&quot;,
          gel: true,
          html: &#x27;&lt;h3&gt;1　测量前准备&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;在前臂桡骨测试部位涂抹足量耦合剂，使皮肤与探头之间均匀覆盖。&lt;/li&gt;&lt;li&gt;将探头充分贴合测试部位，先调整右侧 D，再调整左侧 G。&lt;/li&gt;&lt;li&gt;最终目标是让两条进度条均稳定在中线，然后保持探头不动。&lt;/li&gt;&lt;li&gt;每轮累计 30 个有效值；姿势和信号稳定时通常约 5 秒，共完成 5 轮。&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;bd-emphasis&quot;&gt;每轮结束后，按空格或点击“开始检测”继续下一轮。&lt;/div&gt;&#x27;
        },
        {
          label: &quot;示意图 2：小幅调整探头空间位置&quot;,
          icon: &quot;move&quot;,
          motion: &quot;保持贴合，小幅移动&quot;,
          meter: &quot;D&quot;,
          probe: &quot;translate(-34px, 12px) rotate(0deg)&quot;,
          gel: false,
          html: &#x27;&lt;h3&gt;2　先调整右侧 D：空间位置&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;保持探头与皮肤充分贴合，不要大幅抬起或转动。&lt;/li&gt;&lt;li&gt;沿测试部位小幅移动探头，同时观察右侧 D 进度条。&lt;/li&gt;&lt;li&gt;找到 D 稳定在中线的位置后，保持当前位置。&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;bd-emphasis&quot;&gt;动作幅度要小；不使用固定“向左、向右”指令，避免探头旋转后方向相反。&lt;/div&gt;&#x27;
        },
        {
          label: &quot;示意图 3：小幅调整探头左右倾角&quot;,
          icon: &quot;rotate-ccw&quot;,
          motion: &quot;左右微调倾角&quot;,
          meter: &quot;G&quot;,
          probe: &quot;translate(0, 0) rotate(-15deg)&quot;,
          gel: false,
          html: &#x27;&lt;h3&gt;3　再调整左侧 G：左右倾角&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;保持右侧 D 稳定在中线，小幅调整探头左右倾角。&lt;/li&gt;&lt;li&gt;观察左侧 G 进度条，使 G 也稳定在中线。&lt;/li&gt;&lt;li&gt;两条均在中线后保持姿势，系统自动累计本轮 30 个有效值。&lt;/li&gt;&lt;li&gt;完成一轮后按空格或点击“开始检测”，重复至 5 轮完成。&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;bd-emphasis&quot;&gt;最终判断始终以右侧 D、左侧 G 两条均稳定在中线为准。&lt;/div&gt;&#x27;
        }
      ];

      function paintMotionIcon(name) {
        motion.innerHTML = &#x27;&lt;i data-lucide=&quot;&#x27; + name + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&#x27; + pages[page].motion + &#x27;&lt;/span&gt;&#x27;;
        if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }
      function renderPage() {
        const item = pages[page];
        storyLabel.textContent = item.label;
        probe.style.transform = item.probe;
        gel.hidden = !item.gel;
        miniMeter.hidden = !item.meter;
        miniMeter.dataset.label = item.meter;
        copy.innerHTML = item.html;
        paintMotionIcon(item.icon);
        dots.forEach((dot, index) =&gt; dot.classList.toggle(&quot;active&quot;, index === page));
        count.textContent = (page + 1) + &quot; / 3&quot;;
        prev.disabled = page === 0;
        next.textContent = page === 2 ? (manualMode ? &quot;知道了&quot; : &quot;知道了，开始检测&quot;) : &quot;下一步&quot;;
      }
      function closeGuide(started) {
        dialog.hidden = true;
        dim.hidden = true;
        root.querySelector(&quot;#bd-under-status&quot;).textContent = started ? &quot;当前第 1/5 轮&quot; : &quot;等待开始检测&quot;;
      }
      function openGuide(manual) {
        manualMode = manual;
        page = 0;
        dialog.hidden = false;
        dim.hidden = false;
        root.querySelector(&quot;#bd-skip&quot;).textContent = manual ? &quot;关闭&quot; : &quot;跳过教程&quot;;
        renderPage();
      }

      next.addEventListener(&quot;click&quot;, () =&gt; {
        if (page &lt; 2) { page += 1; renderPage(); }
        else closeGuide(!manualMode);
      });
      prev.addEventListener(&quot;click&quot;, () =&gt; { if (page &gt; 0) { page -= 1; renderPage(); } });
      root.querySelector(&quot;#bd-skip&quot;).addEventListener(&quot;click&quot;, () =&gt; closeGuide(!manualMode));
      root.querySelector(&quot;#bd-close&quot;).addEventListener(&quot;click&quot;, () =&gt; closeGuide(false));
      root.querySelector(&quot;#bd-open-guide&quot;).addEventListener(&quot;click&quot;, () =&gt; openGuide(true));

      const design = { layout: &quot;split&quot;, illustration: &quot;clinical&quot;, dialogWidth: 900, showDots: true };
      function renderDesign() {
        body.classList.toggle(&quot;is-stacked&quot;, design.layout === &quot;stacked&quot;);
        storyboard.classList.toggle(&quot;soft&quot;, design.illustration === &quot;soft&quot;);
        dialog.style.width = &quot;min(&quot; + design.dialogWidth + &quot;px, calc(100% - 44px))&quot;;
        root.querySelector(&quot;#bd-dots&quot;).hidden = !design.showDots;
      }
      renderPage();
      renderDesign();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: dialog, onChange: renderDesign });
        tweak.addSelect(design, &quot;layout&quot;, { label: &quot;内容布局&quot;, options: [{ label: &quot;左图右文&quot;, value: &quot;split&quot; }, { label: &quot;上图下文&quot;, value: &quot;stacked&quot; }] });
        tweak.addSelect(design, &quot;illustration&quot;, { label: &quot;示意图基调&quot;, options: [{ label: &quot;临床线稿&quot;, value: &quot;clinical&quot; }, { label: &quot;柔和扁平&quot;, value: &quot;soft&quot; }] });
        tweak.addSlider(design, &quot;dialogWidth&quot;, { label: &quot;教程宽度&quot;, min: 760, max: 980, step: 20, unit: &quot;px&quot; });
        tweak.addToggle(design, &quot;showDots&quot;, { label: &quot;显示页码点&quot; });
      }
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
